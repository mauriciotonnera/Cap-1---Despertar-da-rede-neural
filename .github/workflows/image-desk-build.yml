name: Build Image Desk 3.3 native apps

on:
  push:
    branches:
      - imagedesk-native-build

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows executable
        shell: pwsh
        run: ./image-desk/build_windows.ps1
      - name: Verify packaged playback, playlists and presentation controls
        run: python image-desk/verify_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ImageDesk-3.3-Windows-x64
          path: image-desk/dist/ImageDesk.exe
          if-no-files-found: error

  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Intel Mac app
        run: ./image-desk/build_mac.sh
      - name: Verify packaged playback, playlists and presentation controls
        run: python image-desk/verify_build.py
      - name: Make disk image
        run: ./image-desk/package_mac.sh Intel
      - uses: actions/upload-artifact@v4
        with:
          name: ImageDesk-3.3-macOS-Intel
          path: image-desk/dist/ImageDesk-3.3-macOS-Intel.dmg
          if-no-files-found: error

  mac-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Apple Silicon Mac app
        run: ./image-desk/build_mac.sh
      - name: Verify packaged playback, playlists and presentation controls
        run: python image-desk/verify_build.py
      - name: Make disk image
        run: ./image-desk/package_mac.sh Apple-Silicon
      - uses: actions/upload-artifact@v4
        with:
          name: ImageDesk-3.3-macOS-Apple-Silicon
          path: image-desk/dist/ImageDesk-3.3-macOS-Apple-Silicon.dmg
          if-no-files-found: error

  windows-legacy:
    name: Windows legacy (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Install original Python 3.8.10 Windows runtime
        shell: pwsh
        run: ./image-desk/setup_legacy_python.ps1 -Architecture ${{ matrix.arch }}
      - name: Build Windows 7 SP1 target and audit dependencies
        shell: pwsh
        run: ./image-desk/build_windows_legacy.ps1 -Architecture ${{ matrix.arch }}
      - name: Verify packaged playback, playlists and presentation controls
        run: python image-desk/verify_build.py --legacy
      - uses: actions/upload-artifact@v4
        with:
          name: ImageDesk-3.3-Windows-Legacy-${{ matrix.arch }}
          path: image-desk/dist/ImageDesk-Legacy/
          if-no-files-found: error
      - name: Keep diagnostic reports when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-diagnostics-${{ matrix.arch }}
          path: image-desk/dist/**/*.json
          if-no-files-found: ignore
