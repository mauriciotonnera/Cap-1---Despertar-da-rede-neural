name: Build Image Desk 3.0.1 native apps

on:
  push:
    branches:
      - imagedesk-native-build

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows executable
        shell: pwsh
        run: ./image-desk/build_windows.ps1
      - name: Verify packaged playback, playlists and presentation controls
        run: python image-desk/verify_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ImageDesk-3.0.1-Windows-x64
          path: image-desk/dist/ImageDesk.exe
          if-no-files-found: error

  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Intel Mac app
        run: ./image-desk/build_mac.sh
      - name: Verify packaged playback, playlists and presentation controls
        run: python image-desk/verify_build.py
      - name: Make disk image
        run: ./image-desk/package_mac.sh Intel
      - uses: actions/upload-artifact@v4
        with:
          name: ImageDesk-3.0.1-macOS-Intel
          path: image-desk/dist/ImageDesk-3.0.1-macOS-Intel.dmg
          if-no-files-found: error

  mac-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Apple Silicon Mac app
        run: ./image-desk/build_mac.sh
      - name: Verify packaged playback, playlists and presentation controls
        run: python image-desk/verify_build.py
      - name: Make disk image
        run: ./image-desk/package_mac.sh Apple-Silicon
      - uses: actions/upload-artifact@v4
        with:
          name: ImageDesk-3.0.1-macOS-Apple-Silicon
          path: image-desk/dist/ImageDesk-3.0.1-macOS-Apple-Silicon.dmg
          if-no-files-found: error
